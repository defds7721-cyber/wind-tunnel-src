name: build

# Trigger: push a version tag like v1.0.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # also lets you run it manually from the Actions tab

permissions:
  contents: write       # needed to create a Release and upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: wind_tunnel-windows.exe
            pyinstaller_name: wind_tunnel
            built_path: dist/wind_tunnel.exe
          - os: macos-latest
            artifact: wind_tunnel-macos
            pyinstaller_name: wind_tunnel
            built_path: dist/wind_tunnel

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame pillow pyinstaller

      - name: Build binary
        run: pyinstaller --onefile --noconsole --name ${{ matrix.pyinstaller_name }} wind_tunnel.py

      - name: Rename binary
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.built_path }}" "out/${{ matrix.artifact }}"

      # upload as a workflow artifact (downloadable from the run page)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/${{ matrix.artifact }}

      # if this was triggered by a tag, also attach to the GitHub Release
      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/${{ matrix.artifact }}
